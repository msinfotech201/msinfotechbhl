<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | MS INFOTECH</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="assets/logo.png" alt="MS INFOTECH">
    <h1>Admin Panel</h1>
    <p>Sign in with the authorized Google account to view enquiries and manage the site.</p>

    <button type="button" id="google-signin-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.4 29.3 35 24 35c-6.1 0-11.3-3.9-13.2-9.3-.6-1.7-1-3.5-1-5.2s.4-3.5 1-5.2C12.7 9.9 17.9 6 24 6c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 1 29.6-1 24 0 13.4 0 4.6 6.6 1.3 15.9c-.8 2.4-1.3 4.9-1.3 8.1s.5 5.7 1.3 8.1C4.6 41.4 13.4 48 24 48c11.6 0 22-8.4 22-24 0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5 29.6 3 24 3c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 48c5.5 0 10.4-1.8 14.3-5l-6.6-5.6C29.6 39 26.9 40 24 40c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.4 43.7 16.1 48 24 48z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.8-5 6.4l6.6 5.6C40.8 37 44 30.8 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>

    <div id="admin-msg" class="admin-msg"></div>
    <p class="admin-login-foot"><a href="index.html">&larr; Back to website</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var btn = document.getElementById("google-signin-btn");
var msg = document.getElementById("admin-msg");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "admin-msg is-" + type;
}

// If already signed in with an authorized account, skip straight to the dashboard.
auth.onAuthStateChanged(function (user) {
  if (!user) return;
  checkAdminAndProceed(user, false);
});

btn.addEventListener("click", function () {
  btn.disabled = true;
  showMsg("Opening Google sign-in\u2026", "info");

  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(function (result) {
      checkAdminAndProceed(result.user, true);
    })
    .catch(function (err) {
      btn.disabled = false;
      if (err && err.code === "auth/popup-closed-by-user") {
        showMsg("Sign-in was cancelled.", "info");
      } else {
        showMsg("Sign-in failed: " + (err && err.message ? err.message : "please try again."), "error");
      }
    });
});

// After Google sign-in, confirm this email is an allowed admin.
// - If it's already in the "admins" collection → log the login and go to the dashboard.
// - If it's the configured SUPER_ADMIN_EMAIL logging in for the very first time →
//   create its admin record automatically, then proceed.
// - Otherwise → this Google account is not authorized; sign out.
function checkAdminAndProceed(user, isFreshSignIn) {
  var email = (user.email || "").toLowerCase();

  db.collection("admins").doc(email).get()
    .then(function (doc) {
      if (doc.exists) {
        if (isFreshSignIn) logAdminLogin(user);
        window.location.href = "admin.html";
        return;
      }

      if (email === SUPER_ADMIN_EMAIL.toLowerCase()) {
        return db.collection("admins").doc(email).set({
          email: email,
          name: user.displayName || "",
          isSuperAdmin: true,
          addedBy: "system (bootstrap)",
          addedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
          if (isFreshSignIn) logAdminLogin(user);
          window.location.href = "admin.html";
        });
      }

      // Not an authorized admin.
      btn.disabled = false;
      showMsg("This Google account (" + email + ") is not authorized for admin access. Ask an existing admin to add you.", "error");
      auth.signOut();
    })
    .catch(function (err) {
      btn.disabled = false;
      showMsg("Could not verify admin access: " + (err && err.message ? err.message : "unknown error"), "error");
      auth.signOut();
    });
}

function logAdminLogin(user) {
  db.collection("adminLogins").add({
    email: (user.email || "").toLowerCase(),
    name: user.displayName || "",
    photoURL: user.photoURL || "",
    userAgent: navigator.userAgent,
    loginAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(function (err) { console.error("Could not log admin login:", err); });
}
</script>
</body>
</html>
